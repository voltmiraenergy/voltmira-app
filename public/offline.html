<!doctype html>
<!-- public/offline.html — what the offline worker (public/app-sw.js) shows for
     an app page that was never saved on this device. Static on purpose: it
     has to open with no network at all. The language is the workspace's,
     remembered by the app layout in localStorage. -->
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VoltMira</title>
<style>
  :root { --paper: #F6F5F0; --card: #fff; --ink: #142A21; --muted: #66756C; --line: #E3E1D6; --green: #1E6B4E; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0F1C16; --card: #16261F; --ink: #EEF2EE; --muted: #9DB0A5; --line: #27392F; --green: #5FBF8C; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--paper); color: var(--ink); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 24px; }
  .brand { font-weight: 800; letter-spacing: -.01em; font-size: 15px; margin: 0 0 18px; }
  h1 { font-size: 21px; line-height: 1.25; margin: 0 0 8px; letter-spacing: -.01em; text-wrap: balance; }
  p { margin: 0 0 18px; color: var(--muted); }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  button, a { font: inherit; font-weight: 650; font-size: 14px; border-radius: 10px; padding: 10px 16px; cursor: pointer; text-decoration: none; }
  button { background: var(--green); color: #fff; border: 0; }
  a { color: var(--ink); border: 1px solid var(--line); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="brand">VoltMira</div>
  <h1 id="h">Fără semnal</h1>
  <p id="p">Pagina asta nu e încă salvată pe acest dispozitiv. Paginile deschise cu internet și ofertele recente merg și fără semnal.</p>
  <div class="acts">
    <button type="button" id="retry" onclick="location.reload()">Încearcă din nou</button>
    <a id="home" href="/dashboard">Panou</a>
  </div>
</main>
<script>
  (function () {
    var T = {
      en: ["No signal", "This page isn't saved on this device yet. Pages you have opened online, and your recent quotes, work without a signal.", "Try again", "Dashboard"],
      ro: ["Fără semnal", "Pagina asta nu e încă salvată pe acest dispozitiv. Paginile deschise cu internet și ofertele recente merg și fără semnal.", "Încearcă din nou", "Panou"],
      ru: ["Нет сети", "Эта страница ещё не сохранена на этом устройстве. Страницы, открытые с интернетом, и недавние расчёты работают и без сети.", "Повторить", "Панель"],
      uk: ["Немає мережі", "Ця сторінка ще не збережена на цьому пристрої. Сторінки, відкриті з інтернетом, і нещодавні розрахунки працюють і без мережі.", "Спробувати ще", "Панель"]
    };
    var l = "ro";
    try { l = localStorage.getItem("voltmira_lang") || "ro"; } catch (e) {}
    var s = T[l] || T.ro;
    document.documentElement.lang = T[l] ? l : "ro";
    document.getElementById("h").textContent = s[0];
    document.getElementById("p").textContent = s[1];
    document.getElementById("retry").textContent = s[2];
    document.getElementById("home").textContent = s[3];
    // Back online: go back to where the engineer was trying to go. Browsers
    // can report "online" while a tap on Dashboard is already leaving this
    // page; a reload then would cancel that tap and trap them here. So: never
    // once leaving, and only after the server has actually answered.
    var leaving = false;
    window.addEventListener("beforeunload", function () { leaving = true; });
    window.addEventListener("pagehide", function () { leaving = true; });
    window.addEventListener("online", function () {
      if (leaving) return;
      fetch(location.href, { method: "HEAD", cache: "no-store" })
        .then(function (r) { if (!leaving && r.ok) location.reload(); })
        .catch(function () {});
    });
  })();
</script>
</body>
</html>
