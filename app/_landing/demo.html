================================================================== */
var lastDeleted = null;

function createProject(over){
  var p = normProj(Object.assign({
    id:uid(), title:"New quote", client:"", address:"",
    market:S.settings.defaultMarket||"RO",
    kw:6, price:0.21, cons:5000, batt:false, loan:118,
    status:"draft", ownerId:(S.team[0]||{}).id||null,
    created:Date.now(), updated:Date.now(), proposal:null, nextFollowUp:null, scenarios:[]
  }, over||{}));
  S.projects.unshift(p);
  logAct("quote", tf("a_new_quote",{t:esc(p.title)}), p.id);
  save();
  return p;
}

// keyboard activation for role="button" elements (sortable headers etc.)
document.addEventListener("keydown", function(e){
  if (e.key!=="Enter" && e.key!==" ") return;
  var el = e.target.closest && e.target.closest('[data-act][role="button"]');
  if (!el || el.tagName==="BUTTON") return;
  e.preventDefault(); el.click();
});

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");

  if (act==="new-proj"){ var np=createProject(); S.ui.tab="quote"; save(); nav("project/"+np.id); toast(t("t_new_quote")); }
  else if (act==="open-proj"){ S.ui.tab="quote"; scEditing=null; save(); nav("project/"+id); }
  else if (act==="set-tab"){ S.ui.tab=el.getAttribute("data-v"); scEditing=null; save(); route(); }

  else if (act==="cycle-status"){
    var pr = findProj(id); if (!pr) return;
    var prevStatus = pr.status;
    pr.status = statusCycle(pr.status); pr.updated = Date.now();
    if (pr.status==="won") logAct("won", tf("a_won",{t:esc(pr.title), v:eur(simulate(pr,"expc").cost)}), pr.id);
    save();
    el.className = "chip "+pr.status; el.textContent = statusLabel(pr.status);
    var wasStay = el.getAttribute("data-stay");
    if (!wasStay && current.route==="dashboard") route();
    toast(tf("status_changed",{s:statusLabel(pr.status)}), t("undo"), function(){
      pr.status = prevStatus; pr.updated = Date.now(); save();
      if (current.route==="dashboard" || current.route==="projects") route();
      else { el.className="chip "+pr.status; el.textContent=statusLabel(pr.status); }
    });
  }

  else if (act==="dup-proj"){
    var src = findProj(id); if (!src) return;
    var copy = JSON.parse(JSON.stringify(src));
    copy.id = uid(); copy.title = src.title+" (copy)"; copy.status="draft";
    copy.proposal = null; copy.created = copy.updated = Date.now();
    S.projects.unshift(copy); logAct("quote", tf("a_dup",{t:esc(src.title)}), copy.id); save();
    if (current.route==="project"){ S.ui.tab="quote"; nav("project/"+copy.id); } else route();
    toast(tf("t_dup",{t:copy.title}));
  }

  else if (act==="del-proj"){
    var idx = S.projects.findIndex(function(x){return x.id===id;});
    if (idx<0) return;
    lastDeleted = { item:S.projects[idx], index:idx };
    var title = S.projects[idx].title;
    S.projects.splice(idx,1); save();
    if (current.route==="project") nav("projects"); else route();
    toast(tf("t_deleted",{t:title}),t("undo"),function(){
      if (!lastDeleted) return;
      S.projects.splice(Math.min(lastDeleted.index,S.projects.length),0,lastDeleted.item);
      lastDeleted=null; save(); route(); toast(t("t_restored"));
    });
  }

  else if (act==="filter-status"){ projFilter.status = el.getAttribute("data-v"); projPage = 1; route(); }

  else if (act==="sort-proj"){
    var sk2 = el.getAttribute("data-v");
    if (projSort.key===sk2) projSort.dir = -projSort.dir;
    else { projSort.key = sk2; projSort.dir = (sk2==="title"||sk2==="status") ? 1 : -1; }
    projPage = 1; route();
  }

  else if (act==="proj-page"){
    projPage += +el.getAttribute("data-v"); route();
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  }

  else if (act==="sel-proj"){
    var sid = el.getAttribute("data-id");
    if (projSel[sid]) delete projSel[sid]; else projSel[sid] = true;
    route();
  }

  else if (act==="sel-all"){
    var allOn = projPageIds.length>0 && projPageIds.every(function(pid){ return projSel[pid]; });
    projPageIds.forEach(function(pid){ if (allOn) delete projSel[pid]; else projSel[pid] = true; });
    route();
  }

  else if (act==="sel-clear"){ projSel = {}; route(); }

  else if (act==="compare-sel"){
    var cids = Object.keys(projSel);
    if (cids.length!==2) return;
    openModal(compareInnerHtml(cids[0], cids[1]));
  }

  else if (act==="bulk-status"){
    var bv = el.getAttribute("data-v");
    var bids = Object.keys(projSel);
    if (!bids.length) return;
    var prevStatuses = bids.map(function(bid){ var bp=findProj(bid); return bp ? {id:bid, status:bp.status, updated:bp.updated} : null; }).filter(Boolean);
    prevStatuses.forEach(function(ps){ var bp=findProj(ps.id); bp.status = bv; bp.updated = Date.now(); });
    logAct("sys", prevStatuses.length+" projects set to <b>"+esc(statusLabel(bv))+"</b>");
    save(); route();
    toast(tf("bulk_status_set",{n:prevStatuses.length, s:statusLabel(bv)}), t("undo"), function(){
      prevStatuses.forEach(function(ps){ var bp=findProj(ps.id); if (bp){ bp.status = ps.status; bp.updated = ps.updated; } });
      save(); route(); toast(t("restored"));
    });
  }

  else if (act==="bulk-del"){
    var dids = Object.keys(projSel);
    if (!dids.length) return;
    // remember exact positions so undo puts everything back where it was
    var removed = [];
    S.projects.forEach(function(p2, i2){ if (projSel[p2.id]) removed.push({item:p2, index:i2}); });
    S.projects = S.projects.filter(function(p2){ return !projSel[p2.id]; });
    projSel = {};
    logAct("sys", removed.length+" projects deleted");
    save(); route();
    toast(tf("bulk_deleted",{n:removed.length}), t("undo"), function(){
      removed.forEach(function(rm){ S.projects.splice(Math.min(rm.index, S.projects.length), 0, rm.item); });
      save(); route(); toast(t("restored"));
    });
  }

  else if (act==="export-csv"){
    var exp = projEnriched();
    var csvEsc = function(v){ v = String(v==null?"":v); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    var head = ["Title","Client","Address","Market","System kW","Battery","Payback (years)","Value (EUR)","Status","Owner","Updated"];
    var lines = exp.map(function(r2){
      var p2 = r2.p, q2 = r2.q;
      var ow = S.team.find(function(tm){return tm.id===p2.ownerId;});
      return [p2.title||"", p2.client||"", p2.address||"", p2.market,
        p2.kw.toFixed(1), p2.batt?"yes":"no",
        q2.payback==null?"25+":q2.payback.toFixed(1), Math.round(q2.cost),
        p2.status, ow?ow.name:"", new Date(p2.updated).toISOString().slice(0,10)
      ].map(csvEsc).join(",");
    });
    var blob = new Blob(["﻿"+head.join(",")+"\n"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "voltmira-pipeline-"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(t("t_csv"));
  }

  else if (act==="export-report"){
    var rep = marketReport();
    var csvEsc2 = function(v){ v = String(v==null?"":v); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
    var head2 = ["Market","Projects","Won","Win rate (%)","Avg payback (years)","Pipeline (EUR)"];
    var lines2 = rep.map(function(r2){
      return [r2.name, r2.count, r2.won, r2.winRate==null?"":r2.winRate,
        r2.avgPb==null?"":r2.avgPb.toFixed(1), Math.round(r2.pipeline)].map(csvEsc2).join(",");
    });
    var blob2 = new Blob(["﻿"+head2.join(",")+"\n"+lines2.join("\n")], {type:"text/csv;charset=utf-8"});
    var a2 = document.createElement("a");
    a2.href = URL.createObjectURL(blob2);
    a2.download = "voltmira-market-report-"+new Date().toISOString().slice(0,10)+".csv";
    document.body.appendChild(a2); a2.click();
    setTimeout(function(){ URL.revokeObjectURL(a2.href); a2.remove(); }, 500);
    toast(t("t_report"));
  }

  else if (act==="cli-cur"){
    viewCurrency = el.getAttribute("data-v");
    document.querySelectorAll('[data-act="cli-cur"]').forEach(function(b){
      var on=b.getAttribute("data-v")===viewCurrency;
      b.classList.toggle("on",on); b.setAttribute("aria-pressed", on?"true":"false");
    });
    var pj = findProj(propWatchedId); if (pj) refreshClient(pj);
  }

  else if (act==="audit-reset"){
    clientAudit = null;
    var pj2 = findProj(propWatchedId);
    var ap2=$("aPrice"); if(ap2 && pj2){ ap2.value=pj2.price; ap2.style.setProperty("--fill",((pj2.price-0.05)/0.55*100)+"%"); var o1=$("aPriceOut"); if(o1)o1.textContent="€"+(+pj2.price).toFixed(2)+"/kWh"; }
    var base3=S.settings.engine.bands.expc.infl;
    var ai2=$("aInfl"); if(ai2){ ai2.value=base3; ai2.style.setProperty("--fill",(base3/10*100)+"%"); var o2=$("aInflOut"); if(o2)o2.textContent=base3+"%/yr"; }
    var lv=$("auditHint"); if(lv) lv.textContent="";
    if (pj2) refreshClient(pj2);
  }

  else if (act==="toggle-assump"){
    var a=$("assump"); if(!a) return;
    var open=a.classList.toggle("open");
    el.setAttribute("aria-expanded",open);
    el.textContent = el.textContent.replace(/[\u25BE\u25B4]/, open?"\u25B4":"\u25BE");
  }

  else if (act==="sales-on"){ setSales(true); route(); window.scrollTo(0,0); }
  else if (act==="sales-off"){ setSales(false); route(); }
  else if (act==="toggle-sales-sc"){ S.ui.salesScenarios = el.checked; save(); route(); }

  else if (act==="gen-link"){
    var pj = findProj(id); if(!pj) return;
    if (!(pj.client||"").trim()){
      toast(t("err_need_client"));
      var fc2 = $("fClient"); if (fc2) fc2.focus();
      return;
    }
    if (!pj.proposal){
      pj.proposal = { code:uid(), opens:0, seconds:0, battToggles:0, created:Date.now(), lastOpen:null };
      if (pj.status==="draft") pj.status="sent";
      pj.updated=Date.now();
      logAct("quote", tf("a_link_made",{t:esc(pj.title)}), pj.id);
      save();
    }
    showLinkModal(pj);
  }

  else if (act==="copy-link"){
    var url = el.getAttribute("data-url");
    var done=function(){ toast(t("t_copied")); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,done); else done();
  }

  else if (act==="copy-embed"){
    var code = $("embedCode").textContent;
    var done=function(){ toast(t("t_copied")); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done,done); else done();
  }

  else if (act==="preview-client"){ closeModal(); nav("proposal/"+el.getAttribute("data-code")); }
  else if (act==="back-to-proj"){ S.ui.tab="quote"; save(); nav("project/"+id); }
  else if (act==="close-modal"){ closeModal(); }
  else if (act==="pdf"){
    var pp=findProj(id); if(!pp) return;
    if (pdfUnlocked) printProposal(pp); else showPdfGate(pp);
  }

  else if (act==="pdf-gate"){
    var em = ($("pdfGateEmail").value||"").trim();
    var gErr = $("pdfGateErr");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){
      gErr.textContent = t("pdfg_err"); gErr.style.display="block";
      $("pdfGateEmail").focus(); return;
    }
    var gp = findProj(id);
    el.disabled = true; el.textContent = t("pdfg_sending");
    var API = (typeof location!=="undefined" && /^https?:/.test(location.origin||"")) ? location.origin : "https://voltmira.com";
    var finish = function(){ pdfUnlocked = true; closeModal(); if (gp) printProposal(gp); };
    fetch(API + "/api/waitlist", {
      method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({ email: em, name:"", lang:(S.settings&&S.settings.lang)||"en", source:"demo-pdf" })
    }).then(function(res){
      if (res && res.ok){ toast(t("pdfg_ok")); finish(); }
      else { el.disabled=false; el.textContent=t("pdfg_cta"); gErr.textContent=t("pdfg_err"); gErr.style.display="block"; }
    }, function(){
      // network unreachable (e.g. the static preview mirror): don't trap the user
      finish();
    });
  }

  else if (act==="request-quote"){
    var pq=findProj(id); if(!pq) return;
    S.leads.unshift({id:uid(), name:pq.client||"Client via proposal", note:"Requested the quote for \u201C"+pq.title+"\u201D", hot:true, created:Date.now(), projectId:pq.id});
    logAct("lead", tf("a_requested",{c:esc(pq.client||t("w_a_client")), t:esc(pq.title)}), pq.id);
    saveNow();
    toast(t("t_req_sent"));
  }

  else if (act==="accept-quote"){
    var pa=findProj(id); if(!pa) return;
    if (pa.status==="sent" || pa.status==="draft"){ pa.status="won"; pa.updated=Date.now(); }
    logAct("won", tf("a_accepted",{c:esc(pa.client||t("w_a_client")), t:esc(pa.title)}), pa.id);
    saveNow();
    el.textContent = t("quote_accepted");
    el.setAttribute("disabled","disabled");
    el.style.opacity=".7";
    toast(t("accept_thanks"));
  }

  else if (act==="quote-lead"){
    var ld = S.leads.find(function(l){return l.id===id;}); if(!ld) return;
    var lp = createProject({title:"Quote for "+ld.name, client:ld.name});
    ld.projectId = lp.id; S.ui.tab="quote"; save();
    nav("project/"+lp.id);
    toast(t("t_lead_conv"));
  }

  /* ---- scenarios ---- */
  else if (act==="sc-new"){
    var base = findProj(id); if(!base) return;
    if (base.scenarios.length>=3){ toast(t("sc_limit")); return; }
    var name = "Scenario "+(base.scenarios.length+1);
    base.scenarios.push(blankScenarioFrom(base, name));
    base.updated=Date.now(); save(); route();
  }
  else if (act==="sc-edit"){
    var scId = el.getAttribute("data-sc");
    scEditing = (scEditing===scId) ? null : scId;
    route();
  }
  else if (act==="sc-del"){
    var scId2 = el.getAttribute("data-sc");
    var pr2 = findProj(current.id); if(!pr2) return;
    pr2.scenarios = pr2.scenarios.filter(function(s){return s.id!==scId2;});
    if (scEditing===scId2) scEditing=null;
    pr2.updated=Date.now(); save(); route();
  }

  else if (act==="add-member"){
    var name=$("tmName").value.trim(), role=$("tmRole").value, mail=$("tmMail").value.trim();
    if (!name){ toast(t("t_need_name")); $("tmName").focus(); return; }
    if (S.team.length>=5){ toast(t("t_seats_full")); return; }
    S.team.push({id:uid(),name:name,role:role,email:mail});
    logAct("sys", tf("a_joined",{n:esc(name)}));
    save(); route(); toast(name+" added");
  }
  else if (act==="del-member"){
    if (S.team.length<=1){ toast(t("t_need_member")); return; }
    var ti = S.team.findIndex(function(tm){return tm.id===id;}); if(ti<0) return;
    var gone = S.team.splice(ti,1)[0];
    var fallback = S.team[0].id;
    S.projects.forEach(function(p){ if(p.ownerId===id) p.ownerId=fallback; });
    save(); route(); toast(gone.name+" removed \u2014 projects moved to "+S.team[0].name);
  }

  else if (act==="save-settings"){
    S.settings.company = $("sCo").value.trim()||S.settings.company;
    S.settings.owner = $("sOwner").value.trim()||S.settings.owner;
    S.settings.shortName = $("sShort").value.trim();
    S.settings.logoUrl = $("sLogo").value.trim();
    S.settings.defaultMarket = $("sMkt").value;
    var E=S.settings.engine, gv=function(i,f){var x=parseFloat($(i).value);return isNaN(x)?f:x;};
    E.costPerKw=gv("eCost",E.costPerKw); E.batteryCost=gv("eBatt",E.batteryCost); E.windCostPerKW=gv("eWind",E.windCostPerKW);
    E.baseYield=gv("eYield",E.baseYield); E.opex=gv("eOpex",E.opex);
    E.horizon=Math.max(5,Math.min(40,Math.round(gv("eHorizon",E.horizon))));
    E.bands.pess.ym=gv("ePym",E.bands.pess.ym); E.bands.pess.degr=gv("ePdg",E.bands.pess.degr); E.bands.pess.infl=gv("ePin",E.bands.pess.infl);
    E.bands.opti.ym=gv("eOym",E.bands.opti.ym); E.bands.opti.degr=gv("eOdg",E.bands.opti.degr); E.bands.opti.infl=gv("eOin",E.bands.opti.infl);
    E.bands.expc.degr=gv("eEdg",E.bands.expc.degr); E.bands.expc.infl=gv("eEin",E.bands.expc.infl);
    S.settings.subsidyAmountRon=gv("eSubsidy",S.settings.subsidyAmountRon);
    S.settings.prosumerLimitKw=gv("eProsumer",S.settings.prosumerLimitKw);
    var scur=$("sCurrency"); if(scur) S.settings.currency=scur.value;
    saveNow(); route(); toast(t("t_settings_saved"));
  }
  else if (act==="restore-engine"){
    var keepWind = S.settings.engine.windCostPerKW;
    S.settings.engine = defaultEngine(); S.settings.engine.windCostPerKW=keepWind; save(); route(); toast(t("t_engine_reset"));
  }

  else if (act==="export-data"){
    var blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="voltmira-data.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},4000); toast(t("t_backup"));
  }
  else if (act==="import-data"){ $("importFile").click(); }
  else if (act==="reset-demo"){
    openModal('<h4>'+esc(t("reset_demo"))+'?</h4><p class="sub">This replaces all projects, team members, leads and settings with the original demo. There\u2019s no undo.</p>'+
      '<div class="modal-acts"><button class="btn ghost" data-act="close-modal">'+esc(t("btn_cancel"))+'</button>'+
      '<button class="btn danger" data-act="confirm-reset">'+esc(t("reset_demo"))+'</button></div>');
  }
  else if (act==="reset-app"){
    openModal('<h4>'+esc(t("reset_app"))+'?</h4><p class="sub">'+esc(t("reset_app_q"))+'</p>'+
      '<div class="modal-acts"><button class="btn ghost" data-act="close-modal">'+esc(t("btn_cancel"))+'</button>'+
      '<button class="btn danger" data-act="confirm-reset">'+esc(t("reset_everything"))+'</button></div>');
  }
  else if (act==="confirm-reset"){ S = seedState(); S.v=CURRENT_VERSION; saveNow(); closeModal(); nav("dashboard"); route(); toast(t("t_demo_reset")); }

  else if (act==="widget-submit"){
    var d = {
      name:($("wName").value||"").trim(), address:($("wAddr").value||"").trim(),
      bill:($("wBill").value||"").trim(), email:($("wMail").value||"").trim(),
      phone:(($("wPhone")||{}).value||"").trim(), message:($("wMsg").value||"").trim()
    };
    if (!d.name){ toast(t("t_add_name")); $("wName").focus(); return; }
    store.set("voltmira_widget_lead", JSON.stringify(d));
    $("widgetBody").innerHTML = '<div style="text-align:center;padding:20px 0">'+
      '<div style="width:56px;height:56px;border-radius:50%;background:var(--green-tint);color:var(--green);display:grid;place-items:center;margin:0 auto 16px">'+
      '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>'+
      '<h2 class="w-title" style="text-align:center">'+esc(t("w_thanks_t"))+'</h2>'+
      '<p class="w-sub" style="text-align:center">'+esc(tf("w_thanks_s",{co:S.settings.company}))+'</p>'+
      '<a class="btn primary" href="#dashboard?lead=1" style="margin-top:8px">'+esc(t("w_learn"))+'</a>'+
      '<button class="btn ghost" data-act="widget-again" style="margin-top:10px;width:100%">'+esc(t("w_another"))+'</button>'+
    '</div>';
    toast(t("t_sent"));
  }
  else if (act==="widget-again"){ route(); }
});

/* select change delegation (language) */
document.addEventListener("change", function(e){
  var el = e.target;
  if (el.id==="sLang"){
    S.settings.lang = el.value; saveNow();
    try { window.__demoLang = el.value; window.dispatchEvent(new Event("demolang")); } catch (e) {}
    renderSidebar(current.route); route();
    return;
  }
  if (el.id==="sCurrency"){
    S.settings.currency = el.value; saveNow(); route();
    return;
  }
  if (el.id==="importFile"){
    var f = el.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var data = JSON.parse(r.result);
        if (!data || !Array.isArray(data.projects) || !data.settings) throw 0;
        S = data; if(!S.settings.engine) S.settings.engine=defaultEngine();
        if(S.settings.currency==null) S.settings.currency="EUR";
        if(S.settings.subsidyAmountRon==null) S.settings.subsidyAmountRon=20000;
        if(S.settings.prosumerLimitKw==null) S.settings.prosumerLimitKw=10.8;
        S.v=CURRENT_VERSION;
        S.projects.forEach(normProj); saveNow(); route(); toast(t("t_imported"));
      } catch(err){ toast(t("t_bad_backup")); }
    };
    r.readAsText(f); el.value="";
  }
});

/* ==================================================================
   Per-page bindings
================================================================== */
function afterRender(r){
  if (r.route==="project"){
    var p = findProj(r.id); if(!p) return;
    if (S.ui.sales) setSales(true, true);
    if (S.ui.tab==="scenarios" && !S.ui.sales){ bindScenarios(p); return; }
    refreshEditor(p);
    function bind(id, fn, ev){
      var el=$(id); if(!el) return;
      el.addEventListener(ev||"input", function(){ fn(el); p.updated=Date.now(); save(); refreshEditor(p); });
    }
    bind("fTitle", function(el){ p.title=el.value; });
    bind("fClient", function(el){ p.client=el.value; });
    bind("fAddr", function(el){ p.address=el.value; });
    bind("fOwner", function(el){ p.ownerId=el.value; }, "change");
    bind("fFollow", function(el){ p.nextFollowUp=el.value||null; }, "change");
    bind("fMarket", function(el){ p.market=el.value; }, "change");
    bind("fKw", function(el){ p.kw=parseFloat(el.value)||6; el.setAttribute("aria-valuenow", p.kw); });
    bind("fPrice", function(el){ p.price=parseFloat(el.value)||0.21; });
    bind("fCons", function(el){ p.cons=parseFloat(el.value)||5000; });
    bind("fLoan", function(el){ p.loan=parseFloat(el.value)||0; });
    bind("fExtraSub", function(el){ p.extraSubsidy=Math.max(0, parseFloat(el.value)||0); });
    bind("fOpex", function(el){ var v=parseFloat(el.value); p.opexOverride=(el.value===""||isNaN(v))?null:v; });
    /* battery */
    var fb=$("fBatt"); if(fb) fb.addEventListener("change",function(){ p.batt=fb.checked; p.updated=Date.now(); save(); refreshEditor(p); });
    /* AFM subsidy */
    var fa=$("fAfm"); if(fa) fa.addEventListener("change",function(){ p.afmSubsidy=fa.checked; p.updated=Date.now(); save(); refreshEditor(p); });
    /* wind toggle + fields */
    var fw=$("fWind"); if(fw) fw.addEventListener("change",function(){
      p.wind=fw.checked; var wf=$("windFields"); if(wf) wf.style.display=p.wind?"":"none";
      p.updated=Date.now(); save(); refreshEditor(p);
    });
    var fwk=$("fWindKw"); if(fwk) fwk.addEventListener("input",function(){ p.windKw=parseFloat(fwk.value)||3; p.updated=Date.now(); save(); refreshEditor(p); });
    var fws=$("fWindSpeed"); if(fws) fws.addEventListener("input",function(){ p.windSpeed=parseFloat(fws.value)||5.5; p.windPreset="Custom"; var sel=$("fWindRegion"); if(sel) sel.value="Custom"; p.updated=Date.now(); save(); refreshEditor(p); });
    var fwr=$("fWindRegion"); if(fwr) fwr.addEventListener("change",function(){
      p.windPreset=fwr.value;
      if (WIND_PRESETS[fwr.value]!=null){ p.windSpeed=WIND_PRESETS[fwr.value]; var si=$("fWindSpeed"); if(si) si.value=p.windSpeed; }
      p.updated=Date.now(); save(); refreshEditor(p);
    });
    /* monthly */
    var fm=$("fMonthly"); if(fm) fm.addEventListener("change",function(){
      p.useMonthly=fm.checked;
      if (p.useMonthly && !p.consMonthly){ var per=Math.round(p.cons/12); p.consMonthly=MONTHS.map(function(){return per;}); }
      var g=$("monthlyGrid"); if(g) g.style.display=p.useMonthly?"":"none";
      var cf=$("consField"); if(cf) cf.style.display=p.useMonthly?"none":"";
      p.updated=Date.now(); save(); refreshEditor(p);
    });
    document.querySelectorAll(".mo-in").forEach(function(inp){
      inp.addEventListener("input",function(){
        var m=parseInt(inp.getAttribute("data-m"),10);
        if(!p.consMonthly){ var per=Math.round(p.cons/12); p.consMonthly=MONTHS.map(function(){return per;}); }
        p.consMonthly[m]=parseFloat(inp.value)||0;
        p.updated=Date.now(); save(); refreshEditor(p);
      });
    });
  }
  else if (r.route==="proposal"){
    var pp = S.projects.find(function(x){ return x.proposal && x.proposal.code===r.id; });
    if (!pp) return;
    refreshClient(pp);
    var cb = $("cBatt");
    if (cb) cb.addEventListener("change", function(){
      pp.batt = cb.checked; pp.proposal.battToggles += 1;
      logAct("open", tf("a_batt_toggle",{c:esc(pp.client||t("w_your_client")), t:esc(pp.title)}), pp.id);
      save(); refreshClient(pp);
    });
    /* client Audit Portal sliders — recompute the bands with the client's own assumptions */
    function ensureAudit(){ if(!clientAudit) clientAudit={priceMul:1,inflDelta:0}; return clientAudit; }
    function markAuditLive(){
      var live=$("auditHint"); if(!live) return;
      var on = clientAudit && (clientAudit.priceMul!==1 || clientAudit.inflDelta!==0);
      live.textContent = on ? t("audit_on") : "";
    }
    var ap=$("aPrice");
    if (ap) ap.addEventListener("input", function(){
      var v=parseFloat(ap.value)||pp.price; ensureAudit().priceMul = v/pp.price;
      var o=$("aPriceOut"); if(o) o.textContent="€"+v.toFixed(2)+"/kWh";
      ap.style.setProperty("--fill", ((v-0.05)/0.55*100)+"%");
      markAuditLive(); refreshClient(pp);
    });
    var ai=$("aInfl");
    if (ai) ai.addEventListener("input", function(){
      var v=parseFloat(ai.value)||0; var base=S.settings.engine.bands.expc.infl;
      ensureAudit().inflDelta = v-base;
      var o=$("aInflOut"); if(o) o.textContent=(v%1===0?v:v.toFixed(1))+"%/yr";
      ai.style.setProperty("--fill", (v/10*100)+"%");
      markAuditLive(); refreshClient(pp);
    });
    propTimer = setInterval(function(){}, 10000);
  }
  else if (r.route==="projects"){
    var s = $("projSearch");
    if (s){
      s.addEventListener("input", function(){
        projFilter.q = s.value; projPage = 1;
        var scroll = window.scrollY; route(); window.scrollTo(0,scroll);
        var s2=$("projSearch"); if(s2){ s2.focus(); s2.setSelectionRange(s2.value.length,s2.value.length); }
      });
    }
  }
}

/* scenario editor bindings (live) */
function bindScenarios(p){
  function reEval(sc){
    var card = document.querySelector('.sc-card[data-sc="'+sc.id+'"]');
    var e = scEval(sc).e;
    if (card){
      var metrics = card.querySelectorAll('.sc-metrics b');
      if (metrics[0]) metrics[0].textContent = yrsF(e.payback);
      if (metrics[1]) metrics[1].textContent = formatMoney(e.year1/12);
      var meta = card.querySelector('.sc-meta');
      if (meta) meta.textContent = sc.kw.toFixed(1)+' kW \u00B7 '+(sc.batt?"battery":"no battery")+(sc.wind?" \u00B7 wind "+sc.windKw+"kW":"");
    }
    refreshCompareTable(p);
  }
  p.scenarios.forEach(function(sc){
    var q = function(sel){ return document.querySelector(sel); };
    var nm = q('[data-sc-name="'+sc.id+'"]'); if(nm) nm.addEventListener("input",function(){ sc.name=nm.value; p.updated=Date.now(); save(); refreshCompareTable(p); var th=document.querySelectorAll('.cmp-table thead th'); });
    var kw = q('[data-sc-kw="'+sc.id+'"]'); if(kw) kw.addEventListener("input",function(){ sc.kw=parseFloat(kw.value)||6; var o=q('[data-sc-kwout="'+sc.id+'"]'); if(o)o.textContent=sc.kw.toFixed(1)+" kW"; p.updated=Date.now(); save(); reEval(sc); });
    var pr = q('[data-sc-price="'+sc.id+'"]'); if(pr) pr.addEventListener("input",function(){ sc.price=parseFloat(pr.value)||0.21; p.updated=Date.now(); save(); reEval(sc); });
    var cn = q('[data-sc-cons="'+sc.id+'"]'); if(cn) cn.addEventListener("input",function(){ sc.cons=parseFloat(cn.value)||5000; p.updated=Date.now(); save(); reEval(sc); });
    var mk = q('[data-sc-market="'+sc.id+'"]'); if(mk) mk.addEventListener("change",function(){ sc.market=mk.value; p.updated=Date.now(); save(); reEval(sc); });
    var bt = q('[data-sc-batt="'+sc.id+'"]'); if(bt) bt.addEventListener("change",function(){ sc.batt=bt.checked; p.updated=Date.now(); save(); reEval(sc); });
    var wd = q('[data-sc-wind="'+sc.id+'"]'); if(wd) wd.addEventListener("change",function(){ sc.wind=wd.checked; var w=q('[data-sc-windwrap="'+sc.id+'"]'); if(w)w.style.display=sc.wind?"":"none"; p.updated=Date.now(); save(); reEval(sc); });
    var wk = q('[data-sc-windkw="'+sc.id+'"]'); if(wk) wk.addEventListener("input",function(){ sc.windKw=parseFloat(wk.value)||3; p.updated=Date.now(); save(); reEval(sc); });
    var wsp = q('[data-sc-windspeed="'+sc.id+'"]'); if(wsp) wsp.addEventListener("input",function(){ sc.windSpeed=parseFloat(wsp.value)||5.5; p.updated=Date.now(); save(); reEval(sc); });
  });
}
function refreshCompareTable(p){
  /* rebuild only the comparison table + names, cheap enough */
  var host = document.querySelector(".cmp-table");
  if (!host) return;
  var cols = [{name:t("sc_base"), q:quote(p).e}];
  p.scenarios.forEach(function(sc){ cols.push({name:sc.name, q:scEval(sc).e}); });
  function trow(label, fn){ return '<tr><td>'+esc(label)+'</td>'+cols.map(function(c){return '<td>'+fn(c.q)+'</td>';}).join("")+'</tr>'; }
  host.innerHTML = '<thead><tr><th>'+esc(t("sc_metric"))+'</th>'+cols.map(function(c){return '<th>'+esc(c.name)+'</th>';}).join("")+'</tr></thead><tbody>'+
    trow(t("sc_cost"), function(q){return formatMoney(q.cost);})+
    trow(t("sc_gen"), function(q){return kwhF(q.prod0);})+
    trow(t("sc_pb"), function(q){return yrsF(q.payback)+" "+t("years");})+
    trow(t("sc_ms"), function(q){return formatMoney(q.year1/12)+"/mo";})+
  '</tbody>';
}
